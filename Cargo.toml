[package]
name = "mcp-telegram-files"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
keyring = { version = "3", features = ["sync-secret-service"] }
dirs = "6"
